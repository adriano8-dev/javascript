<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportação</title>
</head>
<body>
    <h1>Sistema de Exportação</h1>
    Qual país você mora: <input type="text" name="txtpais" id="txtpais">
    <input type="button" value="Verificar" onclick="verificador()">
    <div id="res">

    </div>
    
    <script>
        function verificador() {
        var txtp = document.querySelector('input#txtpais')
        var res = document.querySelector('div#res')
        var p = txtp.value
        res.innerHTML = `<p>Você mora atualmente no país <strong>${p}</strong></p>`
        if (p == 'Brasil') {
            res.innerHTML += `<p>Você é <strong>Brasileiro</strong></p>` 
        } else {
            res.innerHTML += `<p>Você é <strong>Estrangeiro</strong></p>`
        }
        }
    </script>
</body>
</html>
